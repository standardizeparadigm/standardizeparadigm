<svg width="500" height="205" viewBox="0 0 500 205" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="github stats card">
  <style>
    .t   { font: 700 18px 'Segoe UI', Ubuntu, Helvetica, sans-serif; fill: #38BDF8 }
    .k   { font: 600 13px 'Segoe UI', Ubuntu, Helvetica, sans-serif; fill: #C9D1D9 }
    .v   { font: 700 13px 'Segoe UI', Ubuntu, Helvetica, sans-serif; fill: #7DD3FC }
    .s   { font: 400 10px 'Segoe UI', Ubuntu, Helvetica, sans-serif; fill: #8B949E }
    .g   { font: 700 26px 'Segoe UI', Ubuntu, Helvetica, sans-serif; fill: #FFFFFF }
    .row { opacity: 0; animation: slide .55s ease-out forwards }
    @keyframes slide { from { opacity: 0; transform: translateX(-10px) } to { opacity: 1; transform: translateX(0) } }
    .bar { transform: scaleX(0); transform-origin: left center; animation: grow 1.15s cubic-bezier(.2,.8,.2,1) forwards }
    @keyframes grow { to { transform: scaleX(1) } }
    .glow { animation: pulse 3.2s ease-in-out infinite }
    @keyframes pulse { 0%, 100% { opacity: .55 } 50% { opacity: 1 } }
  </style>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.15" />
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="499" height="204" rx="10" fill="#0D1117" stroke="url(#edge)" stroke-width="1" />
  <text x="25" y="33" class="t">Standardize Paradigm - GitHub Stats</text>
  <rect x="25" y="41" width="46" height="3" rx="1.5" fill="#38BDF8" class="glow" />
  <g class="row" style="animation-delay: 0.00s">
    <text x="27" y="68" class="k">⭐</text>
    <text x="52" y="68" class="k">Total Stars Earned</text>
    <text x="330" y="68" class="v" text-anchor="end">1</text>
  </g>
  <g class="row" style="animation-delay: 0.12s">
    <text x="27" y="90" class="k">🍴</text>
    <text x="52" y="90" class="k">Total Forks</text>
    <text x="330" y="90" class="v" text-anchor="end">0</text>
  </g>
  <g class="row" style="animation-delay: 0.24s">
    <text x="27" y="112" class="k">📦</text>
    <text x="52" y="112" class="k">Public Repositories</text>
    <text x="330" y="112" class="v" text-anchor="end">2</text>
  </g>
  <g class="row" style="animation-delay: 0.36s">
    <text x="27" y="134" class="k">👥</text>
    <text x="52" y="134" class="k">Followers</text>
    <text x="330" y="134" class="v" text-anchor="end">0</text>
  </g>
  <g class="row" style="animation-delay: 0.48s">
    <text x="27" y="156" class="k">🔭</text>
    <text x="52" y="156" class="k">Following</text>
    <text x="330" y="156" class="v" text-anchor="end">2</text>
  </g>
  <g class="row" style="animation-delay: 0.60s">
    <text x="27" y="178" class="k">⚡</text>
    <text x="52" y="178" class="k">Total Commits</text>
    <text x="330" y="178" class="v" text-anchor="end">95</text>
  </g>
  <circle cx="417" cy="112" r="44" stroke="#0EA5E9" stroke-width="7" fill="none" opacity="0.25" />
  <circle cx="417" cy="112" r="44" stroke="#38BDF8" stroke-width="7" fill="none" stroke-linecap="round" transform="rotate(-90 417 112)" stroke-dasharray="276.5" stroke-dashoffset="276.5">
    <animate attributeName="stroke-dashoffset" from="276.5" to="182.5" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" />
  </circle>
  <text x="417" y="120" class="g" text-anchor="middle">C</text>
  <text x="417" y="138" class="s" text-anchor="middle">RANK</text>
  <text x="25" y="191" class="s">Tu dong cap nhat moi ngay • anh nam trong repo nen khong bao gio rate-limit</text>
</svg>