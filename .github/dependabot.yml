version: 2

# Giữ các action GitHub luôn mới, nhưng gộp thành một PR mỗi tháng
# để không làm ngập trang Pull Request.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(actions)"
    groups:
      github-actions:
        patterns:
          - "*"
