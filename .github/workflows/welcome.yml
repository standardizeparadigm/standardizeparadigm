# =====================================================================
#  welcome.yml — Chào mừng issue và pull request mới
#
#  Nguyên tắc an toàn:
#    - Bỏ qua tài khoản bot (không chào bot, không tự chào mình)
#    - Chỉ chào MỘT lần cho mỗi issue/PR (dò bình luận cũ trước khi gửi)
#    - Dùng pull_request_target để bình luận được trên PR từ fork
#      (job này KHÔNG checkout code của PR nên không có rủi ro bảo mật)
# =====================================================================
name: Welcome new contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]
  # Nút "Run workflow": hữu ích khi cần kiểm tra workflow mà không phải chờ
  # một issue/PR thật. Lượt chạy tay dừng ngay ở bước đầu (không có số
  # issue/PR để chào).
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: welcome-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  welcome:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.sender.type != 'Bot'
    steps:
      - name: Bỏ qua khi chạy tay
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Chạy tay: không có issue/PR để chào — kết thúc bình thường."
      - name: Chào mừng thành viên mới
        if: github.event_name != 'workflow_dispatch'
        uses: actions/github-script@v9
        with:
          script: |
            const payload = context.payload;
            const isPr = Boolean(payload.pull_request);
            const target = isPr ? payload.pull_request : payload.issue;
            const number = target.number;
            const actor = payload.sender.login;
            const marker = "<!-- welcome-bot -->";

            // Đã chào rồi thì thôi (tránh spam khi mở/đóng/mở lại)
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                per_page: 100,
              }
            );
            if (comments.some((c) => (c.body || "").includes(marker))) {
              core.info(`#${number} đã được chào trước đó — bỏ qua.`);
              return;
            }

            const lines = isPr
              ? [
                  `Chào mừng @${actor} — cảm ơn bạn đã gửi pull request!`,
                  "",
                  "Mình sẽ xem và phản hồi sớm nhất có thể. Nếu đây là PR đầu tiên của bạn, " +
                    "đọc [CONTRIBUTING](../blob/main/.github/CONTRIBUTING.md) để biết quy ước commit nhé.",
                  "",
                  "Chúc bạn một ngày vui vẻ!",
                ]
              : [
                  `Chào mừng @${actor} đến với **Standardize Paradigm**!`,
                  "",
                  "Cảm ơn bạn đã mở issue. Mình sẽ đọc và trả lời sớm nhất có thể.",
                  "",
                  "Nếu chỉ muốn để lại lời nhắn, bạn có thể dùng mẫu " +
                    "[Lời nhắn](../issues/new?template=guestbook.md) nhé.",
                  "",
                  "Chúc bạn một ngày vui vẻ!",
                ];

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              body: marker + "\n" + lines.join("\n"),
            });
            core.info(`Đã chào @${actor} ở #${number}.`);
