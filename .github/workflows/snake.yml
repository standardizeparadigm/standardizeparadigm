# =====================================================================
#  snake.yml - Con "snake" an o contribution
#  Dat file nay tai: .github/workflows/snake.yml
#  Khong can sua gi ca. Sau khi commit: tab Actions -> Run workflow.
# =====================================================================
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"   # tu chay moi 12 tieng
  workflow_dispatch:          # cho phep bam chay tay
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake images
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0EA5E9&color_dots=#0D1117,#0C4A6E,#0284C7,#38BDF8,#7DD3FC
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#38BDF8
            dist/ocean.gif?color_snake=#38BDF8&color_dots=#0D1117,#0C4A6E,#0284C7,#38BDF8,#7DD3FC

      - name: Push images to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
