# =====================================================================
#  profile-3d.yml — Biểu đồ contribution 3D
#
#  Workflow này chỉ chạy trên NHÁNH MẶC ĐỊNH (main).
#  Ảnh được sinh ra trong profile-3d-contrib/ rồi commit lại vào repo.
#
#  Lịch: 01:00 mỗi ngày (giờ Việt Nam, UTC+7) = 18:00 UTC hôm trước.
#  Chạy tay: tab Actions -> GitHub Profile 3D Contrib -> Run workflow.
# =====================================================================
name: GitHub Profile 3D Contrib

on:
  schedule:
    - cron: "0 18 * * *"        # 01:00 giờ Việt Nam
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-3d.yml"

concurrency:
  group: profile-3d
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Bot commit ảnh -> không chạy lại chính mình (tránh vòng lặp vô hạn)
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout nhánh mặc định
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Vẽ biểu đồ 3D
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Kiểm tra ảnh sinh ra
        run: |
          set -e
          if [ ! -d profile-3d-contrib ]; then
            echo "!! Không có thư mục profile-3d-contrib — action không chạy đúng."
            exit 1
          fi
          echo "Số file SVG: $(find profile-3d-contrib -name '*.svg' | wc -l)"
          python3 - <<'PY'
          import glob, sys
          import xml.dom.minidom as md
          bad = []
          for f in glob.glob("profile-3d-contrib/*.svg"):
              try:
                  md.parse(f)
              except Exception as e:
                  bad.append("%s: %s" % (f, e))
          if bad:
              print("!! SVG bị lỗi XML:")
              print("\n".join(bad))
              sys.exit(1)
          print("Tất cả SVG đều hợp lệ.")
          PY

      - name: Commit + push
        run: |
          set -e
          TARGET="${{ github.event.repository.default_branch }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          if git diff --cached --quiet; then
            echo "Không có thay đổi — bỏ qua commit."
            exit 0
          fi
          git commit -m "chore(3d): cập nhật biểu đồ contribution"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "$TARGET" || true
            if git push origin "HEAD:$TARGET"; then
              echo "Đã push: $(git log -1 --oneline)"
              exit 0
            fi
            echo "Push lần $i thất bại, thử lại sau ít giây..."
            sleep $((i * 4))
          done
          echo "!! Push thất bại sau 3 lần thử." >&2
          exit 1
