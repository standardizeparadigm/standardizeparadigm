# =====================================================================
#  profile-cards.yml — Thẻ thống kê GitHub (bản LTS)
#
#  Chạy scripts/generate_cards.py để vẽ:
#    assets/stats.svg, assets/top-langs.svg, assets/hero.svg, assets/divider.svg
#
#  Chế độ --strict: API lỗi là báo đỏ ngay, không âm thầm giữ ảnh cũ.
#  Dùng GITHUB_TOKEN có sẵn của repo -> quota riêng, không bị 503.
#
#  Lịch: 08:00 mỗi ngày (giờ Việt Nam) = 01:00 UTC.
# =====================================================================
name: Profile Cards (LTS)

on:
  schedule:
    - cron: "0 1 * * *"         # 08:00 giờ Việt Nam
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "scripts/generate_cards.py"
      - ".github/workflows/profile-cards.yml"

concurrency:
  group: profile-cards
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout nhánh mặc định
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Thông tin môi trường
        run: |
          echo "Nhánh mặc định : ${{ github.event.repository.default_branch }}"
          echo "Chủ repo        : ${{ github.repository_owner }}"
          echo "Commit          : $(git log -1 --oneline)"
          echo "Python          : $(python3 --version 2>&1)"
          find . -type f -name "*.py" -not -path "./.git/*"

      - name: Vẽ thẻ (chế độ --strict)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          DISPLAY_NAME: Standardize Paradigm
          OUT_DIR: assets
        run: |
          set -e
          python3 scripts/generate_cards.py --cards --hero --strict

      - name: Kiểm tra ảnh vừa ghi
        run: |
          set -e
          python3 - <<'PY'
          import sys
          import xml.dom.minidom as md
          for f in ("assets/stats.svg", "assets/top-langs.svg",
                    "assets/hero.svg", "assets/divider.svg"):
              try:
                  md.parse(f)
              except Exception as e:
                  print("!! %s lỗi XML: %s" % (f, e))
                  sys.exit(1)
              raw = open(f, encoding="utf-8").read()
              if "Chưa có dữ liệu" in raw or "Chạy workflow" in raw:
                  print("!! %s vẫn là thẻ tạm" % f)
                  sys.exit(1)
              print("OK  %-22s %6d bytes" % (f, len(raw.encode("utf-8"))))
          PY

      - name: Commit + push
        run: |
          set -e
          TARGET="${{ github.event.repository.default_branch }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "Không có thay đổi — bỏ qua commit."
            exit 0
          fi
          git commit -m "chore(cards): cập nhật thẻ thống kê"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "$TARGET" || true
            if git push origin "HEAD:$TARGET"; then
              echo "Đã push: $(git log -1 --oneline)"
              exit 0
            fi
            sleep $((i * 4))
          done
          echo "!! Push thất bại sau 3 lần thử." >&2
          exit 1

      - name: Nhắc về cache ảnh
        if: always()
        run: |
          echo "Nếu trang cá nhân vẫn hiện ảnh cũ thì đó là CACHE của GitHub,"
          echo "không phải lỗi. Đợi 1–5 phút rồi Ctrl+F5."
