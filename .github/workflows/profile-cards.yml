# =====================================================================
#  profile-cards.yml  --  The thong ke GitHub (ban LTS v7)
#
#  v7 sua loi "chay xanh nhung the van la ban tam":
#   - chay script o che do --strict: khong lay duoc du lieu thi BAO DO,
#     khong im lang nua.
#   - kiem tra lai noi dung file SVG sau khi chay.
#   - in ro da push commit nao.
#
#  Dat file nay tai: .github/workflows/profile-cards.yml
#  KHONG can sua gi, KHONG can tao token rieng.
# =====================================================================
name: Profile Cards (LTS)

on:
  schedule:
    - cron: "0 1 * * *"     # moi ngay 08:00 gio Viet Nam
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "**/generate_cards.py"
      - ".github/workflows/profile-cards.yml"

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Chan doan - in ra cay file thuc te
        run: |
          echo "Nhanh dang chay : ${{ github.ref_name }}"
          echo "Nhanh mac dinh  : ${{ github.event.repository.default_branch }}"
          echo "Chu repo        : ${{ github.repository_owner }}"
          echo "Commit          : $(git log -1 --oneline 2>/dev/null || echo khong-doc-duoc)"
          echo "Python          : $(python3 --version 2>&1)"
          echo ""
          echo "--- Noi dung goc repo ---"
          ls -la
          echo ""
          echo "--- Moi file .py trong repo ---"
          find . -type f -name "*.py" -not -path "./.git/*" 2>/dev/null || true

      - name: Tim va chay script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          DISPLAY_NAME: Standardize Paradigm
        run: |
          set -e
          SCRIPT=$(find . -type f -iname "generate_cards*" -not -path "./.git/*" 2>/dev/null | head -n 1)

          if [ -z "$SCRIPT" ]; then
            echo "================================================================="
            echo " KHONG TIM THAY generate_cards.py TRONG NHANH NAY"
            echo "================================================================="
            echo "  1. Sai nhanh: dang chay ${{ github.ref_name }},"
            echo "     nhanh mac dinh la ${{ github.event.repository.default_branch }}"
            echo "  2. File con nam trong Pull Request chua merge"
            echo "  3. Ten file bi doi (generate_cards.py.txt)"
            echo "  4. Up ca thu muc giai nen -> duong dan bi long 1 cap"
            echo "  5. Up nguyen file .zip (GitHub khong tu giai nen)"
            exit 1
          fi

          echo "Da tim thay script: $SCRIPT"
          ROOT=$(cd "$(dirname "$SCRIPT")/.." && pwd)
          echo "CARD_ROOT=$ROOT" >> "$GITHUB_ENV"

          if [ "$ROOT" != "$(pwd)" ]; then
            echo "*** CANH BAO: file khong nam o GOC repo. The van tao duoc,"
            echo "    nhung GitHub CHI hien profile README o goc repo. ***"
          fi

          cp "$SCRIPT" /tmp/generate_cards.py
          mkdir -p "$ROOT/assets"

          echo ""
          echo "--- Chay script (che do --strict: loi la bao do) ---"
          OUT_DIR="$ROOT/assets" python3 /tmp/generate_cards.py --strict

          echo ""
          echo "--- Kiem tra lai noi dung the vua ghi ---"
          for f in stats.svg top-langs.svg; do
            if [ ! -f "$ROOT/assets/$f" ]; then
              echo "!! thieu $f"; exit 1
            fi
            if grep -q "Chay workflow\|Chua co du lieu" "$ROOT/assets/$f"; then
              echo "!! $f VAN LA THE TAM -> script khong ghi de duoc."
              echo "   Doc cac dong HTTP o phan tren de biet ly do."
              exit 1
            fi
            echo "OK  $f  ($(wc -c < "$ROOT/assets/$f") bytes)"
          done
          ls -la "$ROOT/assets"

      - name: Commit + push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$CARD_ROOT/assets"
          if git diff --quiet --cached; then
            echo "Khong co gi thay doi (the moi giong y the cu) - bo qua."
          else
            git commit -m "chore: cap nhat the thong ke"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
            echo "Da push: $(git log -1 --oneline)"
          fi
          echo ""
          echo "================================================================="
          echo " XONG. Neu trang ca nhan van hien the cu thi do la CACHE ANH"
          echo " cua GitHub, khong phai loi. Doi 1-5 phut roi Ctrl+F5."
          echo " Muon xem su that ngay, mo link nay:"
          echo " github.com/${{ github.repository_owner }}/${{ github.repository_owner }}/blob/${{ github.ref_name }}/assets/stats.svg"
          echo "================================================================="
