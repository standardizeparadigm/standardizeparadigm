# =====================================================================
#  profile-cards.yml — Thẻ thống kê, ngôn ngữ, ảnh bìa, hoạt động
#
#  Chạy mỗi 30 phút: số liệu GitHub đổi không nhanh bằng đồng hồ, nhưng
#  cập nhật nửa tiếng một lần thì trang luôn "tươi" mà vẫn nhẹ.
#
#  Bước 1: --cards --hero --strict   (lỗi API là báo đỏ ngay)
#  Bước 2: --activity               (GraphQL; lỗi thì giữ ảnh cũ, không đỏ)
#  Bước 3: kiểm tra XML từng ảnh trước khi commit
# =====================================================================
name: Profile Cards (LTS)

on:
  schedule:
    - cron: "*/30 * * * *"       # mỗi 30 phút
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "scripts/generate_cards.py"
      - "scripts/svgkit/**"
      - ".github/workflows/profile-cards.yml"

concurrency:
  group: profile-cards
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout nhánh mặc định
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Thông tin môi trường
        run: |
          echo "Nhánh mặc định : ${{ github.event.repository.default_branch }}"
          echo "Chủ repo        : ${{ github.repository_owner }}"
          echo "Commit          : $(git log -1 --oneline)"
          echo "Python          : $(python3 --version 2>&1)"

      - name: Vẽ thẻ (chế độ --strict)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          DISPLAY_NAME: Standardize Paradigm
          OUT_DIR: assets
        run: python3 scripts/generate_cards.py --cards --hero --strict

      - name: Vẽ thẻ hoạt động (không chặn workflow)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          OUT_DIR: assets
        run: |
          python3 scripts/generate_cards.py --activity \
            || echo "(bỏ qua) không lấy được lịch contribution — giữ ảnh cũ"

      - name: Kiểm tra ảnh vừa ghi
        run: |
          set -e
          python3 - <<'PY'
          import os
          import sys
          import xml.dom.minidom as md

          required = ["assets/stats.svg", "assets/top-langs.svg",
                      "assets/hero.svg", "assets/divider.svg",
                      "assets/footer.svg"]
          optional = ["assets/activity.svg", "assets/live-clock.svg"]

          for path in required + [p for p in optional if os.path.exists(p)]:
              try:
                  md.parse(path)
              except Exception as error:
                  print("!! %s lỗi XML: %s" % (path, error))
                  sys.exit(1)
              raw = open(path, encoding="utf-8").read()
              if "Chưa có dữ liệu" in raw or "Chạy workflow" in raw:
                  print("!! %s vẫn là thẻ tạm" % path)
                  sys.exit(1)
              print("OK  %-24s %6d bytes" % (path, len(raw.encode("utf-8"))))
          PY

      - name: Commit + push
        run: |
          set -e
          TARGET="${{ github.event.repository.default_branch }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "Không có thay đổi — bỏ qua commit."
            exit 0
          fi
          git commit -m "chore(cards): cập nhật thẻ $(TZ=Asia/Ho_Chi_Minh date '+%H:%M')"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "$TARGET" || true
            if git push origin "HEAD:$TARGET"; then
              echo "Đã push: $(git log -1 --oneline)"
              exit 0
            fi
            sleep $((i * 4))
          done
          echo "!! Push thất bại sau 3 lần thử." >&2
          exit 1

      - name: Nhắc về cache ảnh
        if: always()
        run: |
          echo "Trang vẫn hiện ảnh cũ thì đó là CACHE của GitHub, không phải lỗi."
          echo "Đợi 1–5 phút rồi Ctrl+F5."
