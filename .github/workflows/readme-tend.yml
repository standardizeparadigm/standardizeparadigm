# =====================================================================
#  readme-tend.yml  --  Nuôi dưỡng trang README (vườn không bao giờ khô cạn)
#
#  Cong viec:
#    - Cap nhat con dau "lan cap nhat gan nhat" o cuoi README (<!-- TENDED_AT -->)
#    - Kiem tra cac file tai lieu can thi (assets/, profile-3d-contrib/)
#    - Commit va push neu co thay doi
#
#  Dat file tai: .github/workflows/readme-tend.yml
# =====================================================================
name: 🌱 README Garden

on:
  schedule:
    - cron: "0 7 * * 3"   # moi Chu nhat 14:00 gio Viet Nam (UTC+7)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "README.md"

concurrency:
  group: readme-tend
  cancel-in-progress: false

jobs:
  tend:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Cap nhat con dau lan tam quan tri
        id: stamp
        run: |
          TODAY=$(date +%d/%m/%Y)
          echo "TODAY=$TODAY" >> "$GITHUB_ENV"
          echo "Ngay hom nay: $TODAY"

      - name: Thay the con dau TENDED_AT trong README
        run: |
          sed -i "s|<!-- TENDED_AT:.*-->|<!-- TENDED_AT: $TODAY -->|" README.md
          grep -n "TENDED_AT" README.md

      - name: Kiem tra tai lieu can thi
        run: |
          for d in assets profile-3d-contrib; do
            if [ -d "$d" ]; then
              echo "OK  thu muc $d co $(ls -1 "$d" | wc -l) file"
            else
              echo "!! THIEU thu muc $d"
            fi
          done

      - name: Commit + push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "Khong co gi thay doi - bo qua commit."
          else
            git commit -m "chore(tend): cap nhat con dau nuoi duong $TODAY"
            git push
            echo "Da push commit cap nhat con dau."
          fi
