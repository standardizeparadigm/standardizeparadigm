<svg width="640" height="258" viewBox="0 0 640 258" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="dong ho Viet Nam cap nhat moi 5 phut" preserveAspectRatio="xMidYMid meet">
  <style>

  .fSans { font-family: 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; }
  .fMono { font-family: 'Fira Code',Consolas,'SF Mono',monospace; }
  .cardTitle   { font: 800 14px 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #E8F4FF; letter-spacing: 2.2px; }
  .cardSub     { font: 600 9.5px 'Fira Code',Consolas,'SF Mono',monospace; fill: #5C7590; letter-spacing: .8px; }
  .tileValue   { font: 800 19px 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #F2FAFF; }
  .tileLabel   { font: 600 9.5px 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #7E97B0; letter-spacing: .7px; }
  .legendName  { font: 700 11.5px 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #D4E6F5; }
  .legendValue { font: 800 11.5px 'Fira Code',Consolas,'SF Mono',monospace; fill: #7DD3FC; }
  .footNote    { font: 500 9px 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #546B84; letter-spacing: .3px; }
  .heroTitle   { font: 800 46px 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; letter-spacing: -1.2px; }
  .heroSub     { font: 600 14.5px 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #9FC4E2; letter-spacing: .2px; }
  .heroPill    { font: 700 10.5px 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #A8D6F4; letter-spacing: .5px; }
  .heroType    { font: 600 13px 'Fira Code',Consolas,'SF Mono',monospace; fill: #7DD3FC; }
  .heroHint    { font: 500 10px 'Fira Code',Consolas,'SF Mono',monospace; fill: #4E6884; letter-spacing: .6px; }
  .clockTime   { font: 800 54px 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; letter-spacing: -1.5px; }
  .clockDate   { font: 600 13px 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #A9C6E0; }
  .clockLabel  { font: 700 9px 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #5C7590; letter-spacing: 1.6px; }
  .clockBig    { font: 700 11px 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #B7D3EA; }

  .pulse      { animation: pulse 2.6s ease-in-out infinite; }
  .pulseSlow  { animation: pulse 4.4s ease-in-out infinite; }
  .blink      { animation: blink 1.05s steps(1, end) infinite; }
  .spinSlow   { animation: spin 26s linear infinite;
                transform-box: view-box; transform-origin: center; }
  .spinRev    { animation: spinRev 34s linear infinite;
                transform-box: view-box; transform-origin: center; }
  .driftA     { animation: driftA 16s ease-in-out infinite;
                transform-box: view-box; transform-origin: center; }
  .driftB     { animation: driftB 21s ease-in-out infinite;
                transform-box: view-box; transform-origin: center; }
  .driftC     { animation: driftC 26s ease-in-out infinite;
                transform-box: view-box; transform-origin: center; }
  .twinkle    { animation: twinkle 4s ease-in-out infinite; }
  .fadeUp     { animation: fadeUp .72s cubic-bezier(.2,.8,.2,1) both; }
  .growIn     { animation: growIn .8s cubic-bezier(.2,.8,.2,1) both;
                transform-box: view-box; transform-origin: left center; }
  .sheen      { animation: sheen 6.5s ease-in-out infinite; }
  .secHand    { animation: spin 60s linear infinite;
                transform-box: view-box; transform-origin: var(--cx) var(--cy); }
  .minHand    { animation: spin 3600s linear infinite;
                transform-box: view-box; transform-origin: var(--cx) var(--cy); }
  .hourHand   { animation: spin 43200s linear infinite;
                transform-box: view-box; transform-origin: var(--cx) var(--cy); }

  @keyframes pulse     { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
  @keyframes blink     { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
  @keyframes spin      { to { transform: rotate(360deg) } }
  @keyframes spinRev   { to { transform: rotate(-360deg) } }
  @keyframes driftA    { 0%,100% { transform: translate(0,0) } 50% { transform: translate(26px,-14px) } }
  @keyframes driftB    { 0%,100% { transform: translate(0,0) } 50% { transform: translate(-30px,12px) } }
  @keyframes driftC    { 0%,100% { transform: translate(0,0) scale(1) } 50% { transform: translate(14px,10px) scale(1.06) } }
  @keyframes twinkle   { 0%,100% { opacity: .12 } 50% { opacity: .85 } }
  @keyframes fadeUp    { from { opacity: .001; transform: translateY(9px) } to { opacity: 1; transform: translateY(0) } }
  @keyframes growIn    { from { transform: scaleX(.001) } to { transform: scaleX(1) } }
  @keyframes sheen     { 0% { transform: translateX(-460px) } 55%,100% { transform: translateX(760px) } }

  </style>

