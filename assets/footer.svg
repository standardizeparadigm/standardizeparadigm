<svg width="1000" height="200" viewBox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Thanks for visiting!" preserveAspectRatio="xMidYMid meet">
  <title>Thanks for visiting!</title>
  <desc>Chân trang: lời cảm ơn và hai lớp sóng chuyển động</desc>
  <style>

  .fSans { font-family: 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; }
  .fMono { font-family: 'Fira Code',Consolas,'SF Mono',monospace; }
  .cardTitle   { font: 800 14px 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #E8F4FF; letter-spacing: 2.2px; }
  .cardSub     { font: 600 9.5px 'Fira Code',Consolas,'SF Mono',monospace; fill: #5C7590; letter-spacing: .8px; }
  .tileValue   { font: 800 19px 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #E8F4FF; }
  .tileLabel   { font: 600 9.5px 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #8CA4BD; letter-spacing: .7px; }
  .legendName  { font: 700 11.5px 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #C6D8EA; }
  .legendValue { font: 800 11.5px 'Fira Code',Consolas,'SF Mono',monospace; fill: #7DD3FC; }
  .footNote    { font: 500 9px 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #5C7590; letter-spacing: .3px; }
  .bigValue    { font: 800 22px 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #E8F4FF; }
  .midLabel    { font: 700 8.5px 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #8CA4BD; letter-spacing: 1.3px; }
  .heroTitle   { font: 800 46px 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; letter-spacing: -1.2px; }
  .heroSub     { font: 600 14.5px 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #8CA4BD; letter-spacing: .2px; }
  .heroPill    { font: 700 10.5px 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #7DD3FC; letter-spacing: .5px; }
  .heroType    { font: 600 13px 'Fira Code',Consolas,'SF Mono',monospace; fill: #7DD3FC; }
  .heroHint    { font: 500 10px 'Fira Code',Consolas,'SF Mono',monospace; fill: #5C7590; letter-spacing: .6px; }
  .clockTime   { font: 800 54px 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; letter-spacing: -1.5px; }
  .clockDate   { font: 600 13px 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #C6D8EA; }
  .clockLabel  { font: 700 9px 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #5C7590; letter-spacing: 1.6px; }
  .clockBig    { font: 700 11px 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #C6D8EA; }
  .footTitle   { font: 800 24px 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #E8F4FF; letter-spacing: .4px; }
  .footSub     { font: 600 11px 'Fira Code',Consolas,'SF Mono',monospace; fill: #7DD3FC; letter-spacing: 1px; }

  .pulse      { animation: pulse 2.6s ease-in-out infinite; }
  .pulseSlow  { animation: pulse 4.4s ease-in-out infinite; }
  .blink      { animation: blink 1.05s steps(1, end) infinite; }
  .spinSlow   { animation: spin 26s linear infinite;
                transform-box: view-box; transform-origin: center; }
  .spinRev    { animation: spinRev 34s linear infinite;
                transform-box: view-box; transform-origin: center; }
  .driftA     { animation: driftA 16s ease-in-out infinite;
                transform-box: view-box; transform-origin: center; }
  .driftB     { animation: driftB 21s ease-in-out infinite;
                transform-box: view-box; transform-origin: center; }
  .driftC     { animation: driftC 26s ease-in-out infinite;
                transform-box: view-box; transform-origin: center; }
  .floatY     { animation: floatY 5.2s ease-in-out infinite; }
  .twinkle    { animation: twinkle 4s ease-in-out infinite; }
  .fadeUp     { animation: fadeUp .72s cubic-bezier(.2,.8,.2,1) both; }
  .growIn     { animation: growIn .8s cubic-bezier(.2,.8,.2,1) both;
                transform-box: view-box; transform-origin: left center; }
  .sheen      { animation: sheen 6.5s ease-in-out infinite; }
  .scan       { animation: scan 7.5s linear infinite; }
  .secHand    { animation: spin 60s linear infinite;
                transform-box: view-box; transform-origin: var(--cx) var(--cy); }
  .minHand    { animation: spin 3600s linear infinite;
                transform-box: view-box; transform-origin: var(--cx) var(--cy); }
  .hourHand   { animation: spin 43200s linear infinite;
                transform-box: view-box; transform-origin: var(--cx) var(--cy); }
  .wave       { animation: wave 14s linear infinite; }
  .wave2      { animation: wave 19s linear infinite reverse; }

  @keyframes pulse     { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
  @keyframes blink     { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
  @keyframes spin      { to { transform: rotate(360deg) } }
  @keyframes spinRev   { to { transform: rotate(-360deg) } }
  @keyframes driftA    { 0%,100% { transform: translate(0,0) } 50% { transform: translate(26px,-14px) } }
  @keyframes driftB    { 0%,100% { transform: translate(0,0) } 50% { transform: translate(-30px,12px) } }
  @keyframes driftC    { 0%,100% { transform: translate(0,0) scale(1) } 50% { transform: translate(14px,10px) scale(1.06) } }
  @keyframes floatY    { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
  @keyframes twinkle   { 0%,100% { opacity: .12 } 50% { opacity: .85 } }
  @keyframes fadeUp    { from { opacity: .001; transform: translateY(9px) } to { opacity: 1; transform: translateY(0) } }
  @keyframes growIn    { from { transform: scaleX(.001) } to { transform: scaleX(1) } }
  @keyframes sheen     { 0% { transform: translateX(-460px) } 55%,100% { transform: translateX(760px) } }
  @keyframes scan      { 0% { transform: translateY(-40px); opacity: 0 } 12% { opacity: .55 }
                         88% { opacity: .55 } 100% { transform: translateY(300px); opacity: 0 } }
  @keyframes wave      { to { transform: translateX(-500px) } }

  /* Ai bật "giảm chuyển động" trong hệ điều hành thì thấy ảnh tĩnh,
     vẫn đẹp và vẫn đủ thông tin — không phải hy sinh nội dung. */
  @media (prefers-reduced-motion: reduce) {
    .pulse, .pulseSlow, .blink, .spinSlow, .spinRev, .driftA, .driftB,
    .driftC, .floatY, .twinkle, .fadeUp, .growIn, .sheen, .scan,
    .secHand, .minHand, .hourHand, .wave, .wave2 { animation: none !important; }
  }

  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#07111D"/>
      <stop offset="100%" stop-color="#0A1421"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity=".75"/>
      <stop offset="45%" stop-color="#0369A1" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="42%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0369A1"/>
      <stop offset="55%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0369A1"/>
      <stop offset="60%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="barGradV" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0369A1" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeMaskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGrad" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <clipPath id="cardBody"><rect x="0" y="0" width="1000" height="200" rx="22"/></clipPath>
  <g clip-path="url(#cardBody)">
    <rect x="0" y="0" width="1000" height="200" fill="url(#bg)"/>
  </g>
  <rect x="0.7" y="0.7" width="998.6" height="198.6" rx="21.3" fill="none" stroke="url(#edge)" stroke-width="1.3"/>
  <g clip-path="url(#cardBody)">
    <ellipse cx="140" cy="-20" rx="260" ry="130" fill="url(#halo)" filter="url(#soft)"/>
    <ellipse cx="880" cy="40" rx="240" ry="130" fill="url(#halo2)" filter="url(#soft)"/>
    <g transform="translate(-500 0)"><g class="wave"><path d="M0 152.0 Q125.0 138.0 250.0 152.0 Q375.0 166.0 500.0 152.0 Q625.0 138.0 750.0 152.0 Q875.0 166.0 1000.0 152.0 Q1125.0 138.0 1250.0 152.0 Q1375.0 166.0 1500.0 152.0 Q1625.0 138.0 1750.0 152.0 Q1875.0 166.0 2000.0 152.0 L2000 200 L0 200 Z" fill="url(#barGrad)" opacity=".16"/></g></g>
    <g transform="translate(-500 0)"><g class="wave2"><path d="M0 170.0 Q125.0 160.0 250.0 170.0 Q375.0 180.0 500.0 170.0 Q625.0 160.0 750.0 170.0 Q875.0 180.0 1000.0 170.0 Q1125.0 160.0 1250.0 170.0 Q1375.0 180.0 1500.0 170.0 Q1625.0 160.0 1750.0 170.0 Q1875.0 180.0 2000.0 170.0 L2000 200 L0 200 Z" fill="url(#accentGrad)" opacity=".22"/></g></g>
  </g>
  <g class="fadeUp">
    <text x="500" y="54" text-anchor="middle" class="footTitle" fill="url(#titleGrad)">Thanks for visiting!</text>
    <text x="500" y="78" text-anchor="middle" class="footSub">Keep learning • Keep building • Keep being curious</text>
    <rect x="452" y="92" width="96" height="3" rx="1.5" fill="url(#accentGrad)" class="pulse"/>
    <text x="500" y="118" text-anchor="middle" class="heroHint">Làm bằng Python và rất nhiều lần Ctrl+S</text>
  </g>
</svg>