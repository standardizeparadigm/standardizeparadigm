<svg width="500" height="205" viewBox="0 0 500 205" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="waiting card">
  <style>
    .t   { font: 700 18px 'Segoe UI', Ubuntu, Helvetica, sans-serif; fill: #38BDF8 }
    .k   { font: 600 13px 'Segoe UI', Ubuntu, Helvetica, sans-serif; fill: #C9D1D9 }
    .v   { font: 700 13px 'Segoe UI', Ubuntu, Helvetica, sans-serif; fill: #7DD3FC }
    .s   { font: 400 10px 'Segoe UI', Ubuntu, Helvetica, sans-serif; fill: #8B949E }
    .g   { font: 700 26px 'Segoe UI', Ubuntu, Helvetica, sans-serif; fill: #FFFFFF }
    .row { opacity: 0; animation: slide .55s ease-out forwards }
    @keyframes slide { from { opacity: 0; transform: translateX(-10px) } to { opacity: 1; transform: translateX(0) } }
    .bar { transform: scaleX(0); transform-origin: left center; animation: grow 1.15s cubic-bezier(.2,.8,.2,1) forwards }
    @keyframes grow { to { transform: scaleX(1) } }
    .glow { animation: pulse 3.2s ease-in-out infinite }
    @keyframes pulse { 0%, 100% { opacity: .55 } 50% { opacity: 1 } }
  </style>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.15" />
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="499" height="204" rx="10" fill="#0D1117" stroke="url(#edge)" stroke-width="1" />
  <text x="25" y="33" class="t">GitHub Stats</text>
  <rect x="25" y="41" width="46" height="3" rx="1.5" fill="#38BDF8" class="glow" />
  <text x="250" y="100" class="k" text-anchor="middle">Chay workflow &quot;Profile Cards&quot; de tao the nay</text>
  <text x="250" y="126" class="s" text-anchor="middle">Actions -&gt; Profile Cards (LTS) -&gt; Run workflow</text>
  <circle cx="234" cy="152" r="5" fill="#38BDF8" class="glow" />
  <circle cx="250" cy="152" r="5" fill="#0EA5E9" class="glow" style="animation-delay:.4s" />
  <circle cx="266" cy="152" r="5" fill="#7DD3FC" class="glow" style="animation-delay:.8s" />
</svg>