<svg width="640" height="258" viewBox="0 0 640 258" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="github stats card" preserveAspectRatio="xMidYMid meet">
  <style>

  .fSans { font-family: 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; }
  .fMono { font-family: 'Fira Code',Consolas,'SF Mono',monospace; }
  .cardTitle   { font: 800 14px 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #E8F4FF; letter-spacing: 2.2px; }
  .cardSub     { font: 600 9.5px 'Fira Code',Consolas,'SF Mono',monospace; fill: #5C7590; letter-spacing: .8px; }
  .tileValue   { font: 800 19px 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #F2FAFF; }
  .tileLabel   { font: 600 9.5px 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #7E97B0; letter-spacing: .7px; }
  .legendName  { font: 700 11.5px 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #D4E6F5; }
  .legendValue { font: 800 11.5px 'Fira Code',Consolas,'SF Mono',monospace; fill: #7DD3FC; }
  .footNote    { font: 500 9px 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #546B84; letter-spacing: .3px; }
  .heroTitle   { font: 800 46px 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; letter-spacing: -1.2px; }
  .heroSub     { font: 600 14.5px 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #9FC4E2; letter-spacing: .2px; }
  .heroPill    { font: 700 10.5px 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #A8D6F4; letter-spacing: .5px; }
  .heroType    { font: 600 13px 'Fira Code',Consolas,'SF Mono',monospace; fill: #7DD3FC; }
  .heroHint    { font: 500 10px 'Fira Code',Consolas,'SF Mono',monospace; fill: #4E6884; letter-spacing: .6px; }
  .clockTime   { font: 800 54px 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; letter-spacing: -1.5px; }
  .clockDate   { font: 600 13px 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #A9C6E0; }
  .clockLabel  { font: 700 9px 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #5C7590; letter-spacing: 1.6px; }
  .clockBig    { font: 700 11px 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #B7D3EA; }

  .pulse      { animation: pulse 2.6s ease-in-out infinite; }
  .pulseSlow  { animation: pulse 4.4s ease-in-out infinite; }
  .blink      { animation: blink 1.05s steps(1, end) infinite; }
  .spinSlow   { animation: spin 26s linear infinite;
                transform-box: view-box; transform-origin: center; }
  .spinRev    { animation: spinRev 34s linear infinite;
                transform-box: view-box; transform-origin: center; }
  .driftA     { animation: driftA 16s ease-in-out infinite;
                transform-box: view-box; transform-origin: center; }
  .driftB     { animation: driftB 21s ease-in-out infinite;
                transform-box: view-box; transform-origin: center; }
  .driftC     { animation: driftC 26s ease-in-out infinite;
                transform-box: view-box; transform-origin: center; }
  .twinkle    { animation: twinkle 4s ease-in-out infinite; }
  .fadeUp     { animation: fadeUp .72s cubic-bezier(.2,.8,.2,1) both; }
  .growIn     { animation: growIn .8s cubic-bezier(.2,.8,.2,1) both;
                transform-box: view-box; transform-origin: left center; }
  .sheen      { animation: sheen 6.5s ease-in-out infinite; }
  .secHand    { animation: spin 60s linear infinite;
                transform-box: view-box; transform-origin: var(--cx) var(--cy); }
  .minHand    { animation: spin 3600s linear infinite;
                transform-box: view-box; transform-origin: var(--cx) var(--cy); }
  .hourHand   { animation: spin 43200s linear infinite;
                transform-box: view-box; transform-origin: var(--cx) var(--cy); }

  @keyframes pulse     { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
  @keyframes blink     { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
  @keyframes spin      { to { transform: rotate(360deg) } }
  @keyframes spinRev   { to { transform: rotate(-360deg) } }
  @keyframes driftA    { 0%,100% { transform: translate(0,0) } 50% { transform: translate(26px,-14px) } }
  @keyframes driftB    { 0%,100% { transform: translate(0,0) } 50% { transform: translate(-30px,12px) } }
  @keyframes driftC    { 0%,100% { transform: translate(0,0) scale(1) } 50% { transform: translate(14px,10px) scale(1.06) } }
  @keyframes twinkle   { 0%,100% { opacity: .12 } 50% { opacity: .85 } }
  @keyframes fadeUp    { from { opacity: .001; transform: translateY(9px) } to { opacity: 1; transform: translateY(0) } }
  @keyframes growIn    { from { transform: scaleX(.001) } to { transform: scaleX(1) } }
  @keyframes sheen     { 0% { transform: translateX(-460px) } 55%,100% { transform: translateX(760px) } }

  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#07111D"/>
      <stop offset="100%" stop-color="#0A1421"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity=".75"/>
      <stop offset="45%" stop-color="#0369A1" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="42%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0369A1"/>
      <stop offset="55%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0369A1"/>
      <stop offset="60%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGrad" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#EAF8FF"/>
      <stop offset="55%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </radialGradient>
    <linearGradient id="divGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="18%" stop-color="#38BDF8" stop-opacity=".55"/>
      <stop offset="50%" stop-color="#7DD3FC" stop-opacity=".95"/>
      <stop offset="82%" stop-color="#38BDF8" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="640" height="258" rx="18" fill="url(#bg)"/>
  <ellipse cx="115" cy="0" rx="260" ry="140" fill="url(#halo)" opacity=".55"/>
  <ellipse cx="589" cy="258" rx="240" ry="120" fill="url(#halo2)" opacity=".45"/>
  <rect x="0.7" y="0.7" width="638.6" height="256.6" rx="17.3" fill="none" stroke="url(#edge)" stroke-width="1.3"/>
  <clipPath id="cardClip"><rect x="0" y="0" width="640" height="258" rx="18"/></clipPath>
  <g clip-path="url(#cardClip)">
    <rect x="-200" y="-60" width="170" height="380" fill="url(#sheenGrad)" class="sheen" opacity=".55"/>
  </g>
  <g class="fadeUp">
    <rect x="22" y="22" width="4" height="18" rx="2" fill="url(#accentGrad)"/>
    <text x="36" y="37" class="cardTitle">GITHUB STATS</text>
    <text x="618" y="36" text-anchor="end" class="cardSub">CẬP NHẬT 19/11 · 15:01</text>
  </g>
  <g class="fadeUp" style="animation-delay:0.08s">
    <rect x="22" y="62" width="180" height="50" rx="12" fill="#0B1B2B" stroke="#17334F" stroke-opacity=".85"/>
    <rect x="30" y="70" width="34" height="34" rx="10" fill="#38BDF8" fill-opacity=".14" stroke="#38BDF8" stroke-opacity=".45"/>
<g transform="translate(37.50 77.50) scale(0.800)" fill="none" stroke="#7DD3FC" stroke-width="1.70" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.9l2.9 5.9 6.5.95-4.72 4.6 1.12 6.49L12 17.8l-5.8 3.04 1.12-6.49L2.6 9.75l6.5-.95z"/></g>
    <text x="74" y="89" class="tileValue">2</text>
    <text x="74" y="103" class="tileLabel">STARS</text>
  </g>
  <g class="fadeUp" style="animation-delay:0.15s">
    <rect x="216" y="62" width="180" height="50" rx="12" fill="#0B1B2B" stroke="#17334F" stroke-opacity=".85"/>
    <rect x="224" y="70" width="34" height="34" rx="10" fill="#38BDF8" fill-opacity=".14" stroke="#38BDF8" stroke-opacity=".45"/>
<g transform="translate(231.50 77.50) scale(0.800)" fill="none" stroke="#7DD3FC" stroke-width="1.70" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5" r="2.4"/><circle cx="6" cy="19" r="2.4"/><circle cx="18" cy="7" r="2.4"/><path d="M6 7.4v9.2"/><path d="M18 9.4c0 4.2-4 4.6-8 5.4"/></g>
    <text x="268" y="89" class="tileValue">0</text>
    <text x="268" y="103" class="tileLabel">FORKS</text>
  </g>
  <g class="fadeUp" style="animation-delay:0.22s">
    <rect x="22" y="120" width="180" height="50" rx="12" fill="#0B1B2B" stroke="#17334F" stroke-opacity=".85"/>
    <rect x="30" y="128" width="34" height="34" rx="10" fill="#38BDF8" fill-opacity=".14" stroke="#38BDF8" stroke-opacity=".45"/>
<g transform="translate(37.50 135.50) scale(0.800)" fill="none" stroke="#7DD3FC" stroke-width="1.70" stroke-linecap="round" stroke-linejoin="round"><rect x="4.4" y="4.4" width="15.2" height="15.2" rx="3"/><path d="M8.4 9h7.2"/><path d="M8.4 12.6h5"/></g>
    <text x="74" y="147" class="tileValue">2</text>
    <text x="74" y="161" class="tileLabel">REPOS</text>
  </g>
  <g class="fadeUp" style="animation-delay:0.29s">
    <rect x="216" y="120" width="180" height="50" rx="12" fill="#0B1B2B" stroke="#17334F" stroke-opacity=".85"/>
    <rect x="224" y="128" width="34" height="34" rx="10" fill="#38BDF8" fill-opacity=".14" stroke="#38BDF8" stroke-opacity=".45"/>
<g transform="translate(231.50 135.50) scale(0.800)" fill="none" stroke="#7DD3FC" stroke-width="1.70" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.2" cy="8.4" r="3.1"/><circle cx="17.2" cy="9.8" r="2.3"/><path d="M3.4 19.2c.5-3.3 2.8-5.2 5.8-5.2s5.3 1.9 5.8 5.2"/><path d="M15.6 14.4c2.2.2 3.9 1.9 4.4 4.4"/></g>
    <text x="268" y="147" class="tileValue">3</text>
    <text x="268" y="161" class="tileLabel">FOLLOWERS</text>
  </g>
  <g class="fadeUp" style="animation-delay:0.36s">
    <rect x="22" y="178" width="180" height="50" rx="12" fill="#0B1B2B" stroke="#17334F" stroke-opacity=".85"/>
    <rect x="30" y="186" width="34" height="34" rx="10" fill="#38BDF8" fill-opacity=".14" stroke="#38BDF8" stroke-opacity=".45"/>
<g transform="translate(37.50 193.50) scale(0.800)" fill="none" stroke="#7DD3FC" stroke-width="1.70" stroke-linecap="round" stroke-linejoin="round"><path d="M2.6 12S6.1 6.4 12 6.4 21.4 12 21.4 12 17.9 17.6 12 17.6 2.6 12 2.6 12z"/><circle cx="12" cy="12" r="2.7"/></g>
    <text x="74" y="205" class="tileValue">5</text>
    <text x="74" y="219" class="tileLabel">FOLLOWING</text>
  </g>
  <g class="fadeUp" style="animation-delay:0.43s">
    <rect x="216" y="178" width="180" height="50" rx="12" fill="#0B1B2B" stroke="#17334F" stroke-opacity=".85"/>
    <rect x="224" y="186" width="34" height="34" rx="10" fill="#38BDF8" fill-opacity=".14" stroke="#38BDF8" stroke-opacity=".45"/>
<g transform="translate(231.50 193.50) scale(0.800)" fill="none" stroke="#7DD3FC" stroke-width="1.70" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.5"/><path d="M2.4 12h6.1"/><path d="M15.5 12h6.1"/></g>
    <text x="268" y="205" class="tileValue">3.5k</text>
    <text x="268" y="219" class="tileLabel">COMMITS</text>
  </g>
  <g class="fadeUp" style="animation-delay:.5s">
    <circle cx="528" cy="144" r="82" fill="url(#halo)" opacity=".85"/>
    <circle cx="528" cy="144" r="68" fill="none" stroke="#0EA5E9" stroke-width="1" stroke-dasharray="2 6" stroke-opacity=".8" class="spinSlow" style="transform-origin:528px 144px;animation-duration:34s"/>
    <circle cx="528" cy="144" r="56" fill="none" stroke="#38BDF8" stroke-width="9" stroke-opacity=".18"/>
    <circle cx="528" cy="144" r="56" fill="none" stroke="url(#accentGrad)" stroke-width="9" stroke-linecap="round" transform="rotate(-90 528 144)" stroke-dasharray="351.9" stroke-dashoffset="91.5">
      <animate attributeName="stroke-dashoffset" from="351.9" to="91.5" dur="1.6s" begin=".15s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
    </circle>
    <text x="528" y="150" text-anchor="middle" class="fSans" style="font:800 32px 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif;fill:#F2FAFF">B+</text>
    <text x="528" y="168" text-anchor="middle" class="fSans" style="font:700 8.5px 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif;fill:#7E97B0;letter-spacing:2px">RANK</text>
    <text x="528" y="224" text-anchor="middle" class="cardSub">74% TIẾN ĐỘ</text>
  </g>
  <g class="fadeUp" style="animation-delay:.62s">
    <circle cx="26" cy="243" r="3" fill="#38BDF8" class="pulse"/>
    <text x="36" y="246" class="footNote">Dữ liệu thật từ GitHub API · ảnh nằm trong repo nên không bao giờ rate-limit</text>
  </g>
</svg>