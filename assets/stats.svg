<svg width="640" height="258" viewBox="0 0 640 258" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GITHUB STATS" preserveAspectRatio="xMidYMid meet">
  <title>GITHUB STATS</title>
  <desc>Thẻ thống kê GitHub: stars, forks, repos, followers, following, commits và hạng</desc>
  <style>

  .fSans       { font-family: 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; }
  .fMono       { font-family: 'Fira Code',Consolas,'SF Mono',monospace; }
  .cardTitle   { font-weight: 800; font-size: 14px; font-family: 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #E8F4FF; letter-spacing: 2.2px; }
  .cardSub     { font-weight: 600; font-size: 9.5px; font-family: 'Fira Code',Consolas,'SF Mono',monospace; fill: #5C7590; letter-spacing: .8px; }
  .tileValue   { font-weight: 800; font-size: 19px; font-family: 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #E8F4FF; }
  .tileLabel   { font-weight: 600; font-size: 9.5px; font-family: 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #8CA4BD; letter-spacing: .7px; }
  .legendName  { font-weight: 700; font-size: 11.5px; font-family: 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #C6D8EA; }
  .legendValue { font-weight: 800; font-size: 11.5px; font-family: 'Fira Code',Consolas,'SF Mono',monospace; fill: #7DD3FC; }
  .footNote    { font-weight: 500; font-size: 9px; font-family: 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #5C7590; letter-spacing: .3px; }
  .bigValue    { font-weight: 800; font-size: 22px; font-family: 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #E8F4FF; }
  .midLabel    { font-weight: 700; font-size: 8.5px; font-family: 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #8CA4BD; letter-spacing: 1.3px; }
  .heroTitle   { font-weight: 800; font-size: 46px; font-family: 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; letter-spacing: -1.2px; }
  .heroSub     { font-weight: 600; font-size: 14.5px; font-family: 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #8CA4BD; letter-spacing: .2px; }
  .heroPill    { font-weight: 700; font-size: 10.5px; font-family: 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #7DD3FC; letter-spacing: .5px; }
  .heroType    { font-weight: 600; font-size: 13px; font-family: 'Fira Code',Consolas,'SF Mono',monospace; fill: #7DD3FC; }
  .heroHint    { font-weight: 500; font-size: 10px; font-family: 'Fira Code',Consolas,'SF Mono',monospace; fill: #5C7590; letter-spacing: .6px; }
  .clockTime   { font-weight: 800; font-size: 54px; font-family: 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; letter-spacing: -1.5px; }
  .clockDate   { font-weight: 600; font-size: 13px; font-family: 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #C6D8EA; }
  .clockLabel  { font-weight: 700; font-size: 9px; font-family: 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #5C7590; letter-spacing: 1.6px; }
  .clockBig    { font-weight: 700; font-size: 11px; font-family: 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #C6D8EA; }
  .footTitle   { font-weight: 800; font-size: 24px; font-family: 'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif; fill: #E8F4FF; letter-spacing: .4px; }
  .footSub     { font-weight: 600; font-size: 11px; font-family: 'Fira Code',Consolas,'SF Mono',monospace; fill: #7DD3FC; letter-spacing: 1px; }

  .pulse      { animation: pulse 2.6s ease-in-out infinite; }
  .pulseSlow  { animation: pulse 4.4s ease-in-out infinite; }
  .blink      { animation: blink 1.05s steps(1, end) infinite; }
  /* Vòng cung quay tại chỗ quanh một chấm nhỏ (dùng cho trạng thái đang chạy) */
  .spinDot    { animation: spin 1.6s linear infinite;
                transform-box: fill-box; transform-origin: center; }
  .spinSlow   { animation: spin 26s linear infinite;
                transform-box: view-box; transform-origin: center; }
  .spinRev    { animation: spinRev 34s linear infinite;
                transform-box: view-box; transform-origin: center; }
  .driftA     { animation: driftA 16s ease-in-out infinite;
                transform-box: view-box; transform-origin: center; }
  .driftB     { animation: driftB 21s ease-in-out infinite;
                transform-box: view-box; transform-origin: center; }
  .driftC     { animation: driftC 26s ease-in-out infinite;
                transform-box: view-box; transform-origin: center; }
  .floatY     { animation: floatY 5.2s ease-in-out infinite; }
  .twinkle    { animation: twinkle 4s ease-in-out infinite; }
  .fadeUp     { animation: fadeUp .72s cubic-bezier(.2,.8,.2,1) both; }
  .growIn     { animation: growIn .8s cubic-bezier(.2,.8,.2,1) both;
                transform-box: view-box; transform-origin: left center; }
  .sheen      { animation: sheen 6.5s ease-in-out infinite; }
  .scan       { animation: scan 7.5s linear infinite; }
  .secHand    { animation: spin 60s linear infinite;
                transform-box: view-box; transform-origin: var(--cx) var(--cy); }
  .minHand    { animation: spin 3600s linear infinite;
                transform-box: view-box; transform-origin: var(--cx) var(--cy); }
  .hourHand   { animation: spin 43200s linear infinite;
                transform-box: view-box; transform-origin: var(--cx) var(--cy); }
  /* Nét đứt chạy dọc theo chính nó: dùng cho đường trung bình, đường dóng */
  .dashFlow   { animation: dashFlow 2.6s linear infinite; }
  .wave       { animation: wave 14s linear infinite; }
  .wave2      { animation: wave 19s linear infinite reverse; }

  @keyframes pulse     { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
  @keyframes blink     { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
  @keyframes spin      { to { transform: rotate(360deg) } }
  @keyframes spinRev   { to { transform: rotate(-360deg) } }
  @keyframes driftA    { 0%,100% { transform: translate(0,0) } 50% { transform: translate(26px,-14px) } }
  @keyframes driftB    { 0%,100% { transform: translate(0,0) } 50% { transform: translate(-30px,12px) } }
  @keyframes driftC    { 0%,100% { transform: translate(0,0) scale(1) } 50% { transform: translate(14px,10px) scale(1.06) } }
  @keyframes floatY    { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
  @keyframes twinkle   { 0%,100% { opacity: .12 } 50% { opacity: .85 } }
  @keyframes fadeUp    { from { opacity: .001; transform: translateY(9px) } to { opacity: 1; transform: translateY(0) } }
  @keyframes growIn    { from { transform: scaleX(.001) } to { transform: scaleX(1) } }
  @keyframes sheen     { 0% { transform: translateX(-460px) } 55%,100% { transform: translateX(760px) } }
  @keyframes scan      { 0% { transform: translateY(-40px); opacity: 0 } 12% { opacity: .55 }
                         88% { opacity: .55 } 100% { transform: translateY(300px); opacity: 0 } }
  @keyframes dashFlow  { to { stroke-dashoffset: -10 } }
  @keyframes wave      { to { transform: translateX(-500px) } }

  /* Ai bật "giảm chuyển động" trong hệ điều hành thì thấy ảnh tĩnh,
     vẫn đẹp và vẫn đủ thông tin — không phải hy sinh nội dung. */
  @media (prefers-reduced-motion: reduce) {
    .pulse, .pulseSlow, .blink, .spinSlow, .spinRev, .driftA, .driftB,
    .driftC, .floatY, .twinkle, .fadeUp, .growIn, .sheen, .scan, .spinDot,
    .dashFlow,
    .liveHour text, .liveMin text,
    .secHand, .minHand, .hourHand, .wave, .wave2 { animation: none !important; }
  }

  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#07111D"/>
      <stop offset="100%" stop-color="#0A1421"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity=".75"/>
      <stop offset="45%" stop-color="#0369A1" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="42%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0369A1"/>
      <stop offset="55%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0369A1"/>
      <stop offset="60%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="barGradV" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0369A1" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeMaskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGrad" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

