<svg width="400" height="205" viewBox="0 0 400 205" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="most used languages card">
  <style>
    .t   { font: 700 18px 'Segoe UI', Ubuntu, Helvetica, sans-serif; fill: #38BDF8 }
    .k   { font: 600 13px 'Segoe UI', Ubuntu, Helvetica, sans-serif; fill: #C9D1D9 }
    .v   { font: 700 13px 'Segoe UI', Ubuntu, Helvetica, sans-serif; fill: #7DD3FC }
    .s   { font: 400 10px 'Segoe UI', Ubuntu, Helvetica, sans-serif; fill: #8B949E }
    .g   { font: 700 26px 'Segoe UI', Ubuntu, Helvetica, sans-serif; fill: #FFFFFF }
    .row { opacity: 0; animation: slide .55s ease-out forwards }
    @keyframes slide { from { opacity: 0; transform: translateX(-10px) } to { opacity: 1; transform: translateX(0) } }
    .bar { transform: scaleX(0); transform-origin: left center; animation: grow 1.15s cubic-bezier(.2,.8,.2,1) forwards }
    @keyframes grow { to { transform: scaleX(1) } }
    .glow { animation: pulse 3.2s ease-in-out infinite }
    @keyframes pulse { 0%, 100% { opacity: .55 } 50% { opacity: 1 } }
  </style>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.15" />
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="399" height="204" rx="10" fill="#0D1117" stroke="url(#edge)" stroke-width="1" />
  <text x="25" y="33" class="t">Most Used Languages</text>
  <rect x="25" y="41" width="46" height="3" rx="1.5" fill="#38BDF8" class="glow" />
  <clipPath id="clip"><rect x="25" y="60" width="350" height="11" rx="5.5" /></clipPath>
  <g clip-path="url(#clip)">
    <rect x="25" y="60" width="350" height="11" fill="#161B22" />
    <rect x="25.0" y="60" width="343.0" height="11" fill="#F1E05A" class="bar" style="animation-delay: 0.00s" />
    <rect x="368.0" y="60" width="6.2" height="11" fill="#3572A5" class="bar" style="animation-delay: 0.08s" />
    <rect x="374.1" y="60" width="1.0" height="11" fill="#C1F12E" class="bar" style="animation-delay: 0.16s" />
    <rect x="374.9" y="60" width="1.0" height="11" fill="#7DD3FC" class="bar" style="animation-delay: 0.24s" />
  </g>
  <g class="row" style="animation-delay: 0.00s">
    <circle cx="30" cy="100" r="5" fill="#F1E05A" />
    <text x="42" y="104" class="k">JavaScript</text>
    <text x="185" y="104" class="v" text-anchor="end">98.0%</text>
  </g>
  <g class="row" style="animation-delay: 0.10s">
    <circle cx="220" cy="100" r="5" fill="#3572A5" />
    <text x="232" y="104" class="k">Python</text>
    <text x="375" y="104" class="v" text-anchor="end">1.8%</text>
  </g>
  <g class="row" style="animation-delay: 0.20s">
    <circle cx="30" cy="124" r="5" fill="#C1F12E" />
    <text x="42" y="128" class="k">Batchfile</text>
    <text x="185" y="128" class="v" text-anchor="end">0.2%</text>
  </g>
  <g class="row" style="animation-delay: 0.30s">
    <circle cx="220" cy="124" r="5" fill="#7DD3FC" />
    <text x="232" y="128" class="k">VBScript</text>
    <text x="375" y="128" class="v" text-anchor="end">0.0%</text>
  </g>
  <text x="25" y="191" class="s">Tinh theo so byte code that trong cac repo cua ban</text>
</svg>